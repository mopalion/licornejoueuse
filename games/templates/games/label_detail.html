{% extends "main.html" %}
{% block content %}
<h1 class="text-2xl text-center font-bold border-orange-500 border-2 m-2">Label : {{ label.label }}</h1>
<h2 class="text-xl font-bold">Description</h2>
<p>{{ label.description }}</p>
<h2 class="text-xl font-bold">Jeux avec ce label</h2>
{% if games %}
<ul>
  {% for game in games %}
  <li><a href="{% url 'detail' game.number %}">{{ game.name }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>Vous n'avez pas encore de jeux avec ce label.</p>
{% endif %}
{% endblock %}
