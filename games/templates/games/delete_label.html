{% extends "main.html" %}
{% block content %}
<form action="{% url 'delete_label' label.id %}" method="post">
  {% csrf_token %}
  <p>
    Voulez-vous supprimer le label « {{ label.label }} » ?
  </p>
  <button type="submit" class="btn m-2">Confirmer</button>
</form>
<button class="btn m-2" type="button">
  <a href="{% url 'labels_index' %}">Annuler</a>
</button>
{% endblock %}
