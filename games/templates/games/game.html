{% extends 'main.html' %}
{% block content %}
	<h1>{{ game.name }}</h1>
  {% if game.image %}
  <img src="/{{ game.image }}"></img>
  {% endif %}
  <p>{{ game.game_type }}</p>
	<p>
	{{ game.details }}
	</p>
	<p>
	Le jeu se trouve à {{ game.location }}.
	</p>
	<p>
	Image : <img src="/{{ game.qrcode }}"></img>
	</p>
{% endblock %}
